id = "herdr-team"
name = "Herdr Team"
version = "0.1.6"
min_herdr_version = "0.9.3"
description = "Project agent teams with a skill, CLI, sidebar and managed Team Console."
platforms = ["linux", "macos"]

# GitHub installs perform setup once. Local links use the actions below.
[[build]]
command = ["node", "bin/setup.js"]

[[panes]]
id = "console"
title = "console"
placement = "tab"
command = ["herdr-team", "console"]

[[actions]]
id = "open-console"
title = "Open Console"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "cli/scripts/plugin-action.ts", "open-console"]

[[actions]]
id = "install"
title = "Install team CLI, skill and sidebar"
command = ["node", "bin/setup.js"]

[[actions]]
id = "configure"
title = "Configure team sidebar and action keys"
command = ["node", "bin/configure.js", "--apply", "--reload"]

[[actions]]
id = "unconfigure"
title = "Remove team sidebar and action key configuration"
command = ["node", "bin/configure.js", "--uninstall", "--reload"]

[[actions]]
id = "install-skill"
title = "Install team skill for installed agents"
command = ["node", "bin/install-skill.js"]

[[actions]]
id = "uninstall-skill"
title = "Remove plugin-owned team skills"
command = ["node", "bin/install-skill.js", "--uninstall"]

[[actions]]
id = "install-cli"
title = "Install bundled team CLI on PATH"
command = ["node", "bin/install-cli.js"]

[[actions]]
id = "uninstall-cli"
title = "Remove plugin-owned team CLI"
command = ["node", "bin/install-cli.js", "--uninstall"]

# One-shot metadata updates: no daemon, polling, or agent prompts.
[[startup]]
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "workspace.created"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "workspace.updated"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "workspace.closed"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "worktree.created"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "worktree.opened"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "pane.agent_detected"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

# Save native session references after startup/turns without metadata feedback loops.
[[events]]
on = "pane.agent_status_changed"
command = ["bun", "cli/scripts/refresh-sidebar.ts", "--sessions-only"]

[[events]]
on = "pane.exited"
command = ["bun", "cli/scripts/refresh-sidebar.ts", "--notify-only"]

[[events]]
on = "pane.closed"
command = ["bun", "cli/scripts/refresh-sidebar.ts", "--notify-only"]

[[events]]
on = "tab.closed"
command = ["bun", "cli/scripts/refresh-sidebar.ts", "--notify-only"]

[[events]]
on = "pane.moved"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "tab.moved"
command = ["bun", "cli/scripts/refresh-sidebar.ts"]
