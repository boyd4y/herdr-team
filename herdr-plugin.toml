id = "herdr-team"
name = "Herdr Team"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Install the team skill, sidebar logos, their font and a prefix+t team board popup."
platforms = ["linux", "macos"]

# GitHub installs perform setup once. Local links use the actions below.
[[build]]
command = ["node", "bin/setup.js"]

[[actions]]
id = "configure"
title = "Configure team sidebar and popup"
command = ["node", "bin/configure.js", "--apply", "--reload"]

[[actions]]
id = "unconfigure"
title = "Remove team sidebar and popup configuration"
command = ["node", "bin/configure.js", "--uninstall", "--reload"]

[[actions]]
id = "install-font"
title = "Install team icon font and terminal mappings"
command = ["node", "bin/install-font.js"]

[[actions]]
id = "uninstall-font"
title = "Remove team icon font and terminal mappings"
command = ["node", "bin/install-font.js", "--uninstall"]

[[actions]]
id = "install-skill"
title = "Install team skill for installed agents"
command = ["node", "bin/install-skill.js"]

[[actions]]
id = "uninstall-skill"
title = "Remove plugin-owned team skills"
command = ["node", "bin/install-skill.js", "--uninstall"]
