id = "herdr-team"
name = "Herdr Team"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Install the team CLI, skill, sidebar and a prefix+t team board popup."
platforms = ["linux", "macos"]

# GitHub installs perform setup once. Local links use the actions below.
[[build]]
command = ["node", "bin/setup.js"]

[[actions]]
id = "install"
title = "Install team CLI, skill and sidebar"
command = ["node", "bin/setup.js"]

[[actions]]
id = "configure"
title = "Configure team sidebar and popup"
command = ["node", "bin/configure.js", "--apply", "--reload"]

[[actions]]
id = "unconfigure"
title = "Remove team sidebar and popup configuration"
command = ["node", "bin/configure.js", "--uninstall", "--reload"]

[[actions]]
id = "install-skill"
title = "Install team skill for installed agents"
command = ["node", "bin/install-skill.js"]

[[actions]]
id = "uninstall-skill"
title = "Remove plugin-owned team skills"
command = ["node", "bin/install-skill.js", "--uninstall"]

[[actions]]
id = "install-cli"
title = "Install bundled team CLI on PATH"
command = ["node", "bin/install-cli.js"]

[[actions]]
id = "uninstall-cli"
title = "Remove plugin-owned team CLI"
command = ["node", "bin/install-cli.js", "--uninstall"]

# One-shot metadata updates: no daemon, polling, or agent prompts.
[[startup]]
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "workspace.created"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "workspace.updated"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "workspace.closed"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "worktree.created"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "worktree.opened"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "pane.agent_detected"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "pane.moved"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]

[[events]]
on = "tab.moved"
command = ["bun", "cli/scripts/cli.ts", "sidebar", "--auto"]
