id = "herdr-team"
name = "Herdr Team"
version = "0.1.56"
min_herdr_version = "0.9.3"
description = "Project agent teams with a skill, CLI, sidebar and managed Team Console."
platforms = ["linux", "macos", "windows"]

# GitHub installs perform setup once. Local links use the actions below.
# Node finds the workspace script from either GitHub install path, root or tui/.
[[build]]
command = ["node", "--run", "setup:tui"]

[[panes]]
id = "console"
title = "console"
placement = "tab"
# Pane cwd is the project. The host supplies the separate plugin root.
command = ["bun", "-e", "await import(require('node:url').pathToFileURL(require('node:path').join(process.env.HERDR_PLUGIN_ROOT, 'bin', 'console.mjs')).href)"]

[[actions]]
id = "open-console"
title = "Open Console"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "../cli/scripts/plugin-action.ts", "open-console"]

[[actions]]
id = "install"
title = "Install team CLI, skill and sidebar"
command = ["node", "bin/setup.cjs"]

[[actions]]
id = "configure"
title = "Configure team sidebar and action keys"
command = ["node", "bin/configure.cjs", "--apply", "--reload"]

[[actions]]
id = "unconfigure"
title = "Remove team sidebar and action key configuration"
command = ["node", "bin/configure.cjs", "--uninstall", "--reload"]

[[actions]]
id = "install-skill"
title = "Install team skill for installed agents"
command = ["node", "../bin/install-skill.js"]

[[actions]]
id = "uninstall-skill"
title = "Remove plugin-owned team skills"
command = ["node", "../bin/install-skill.js", "--uninstall"]

[[actions]]
id = "install-cli"
title = "Install bundled team CLI on PATH"
command = ["node", "../bin/install-cli.js"]

[[actions]]
id = "uninstall-cli"
title = "Remove plugin-owned team CLI"
command = ["node", "../bin/install-cli.js", "--uninstall"]

# One-shot metadata updates: no daemon, polling, or agent prompts.
[[startup]]
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "workspace.created"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "workspace.updated"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "workspace.closed"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "worktree.created"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "worktree.opened"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "pane.agent_detected"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

# Save native session references after startup/turns without metadata feedback loops.
[[events]]
on = "pane.agent_status_changed"
command = ["bun", "../cli/scripts/refresh-sidebar.ts", "--sessions-only"]

[[events]]
on = "pane.exited"
command = ["bun", "../cli/scripts/refresh-sidebar.ts", "--notify-only"]

[[events]]
on = "pane.closed"
command = ["bun", "../cli/scripts/refresh-sidebar.ts", "--notify-only"]

[[events]]
on = "tab.closed"
command = ["bun", "../cli/scripts/refresh-sidebar.ts", "--notify-only"]

[[events]]
on = "pane.moved"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]

[[events]]
on = "tab.moved"
command = ["bun", "../cli/scripts/refresh-sidebar.ts"]
